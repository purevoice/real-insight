<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Add Post | Real Insight</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="admin-page">

    <section class="admin-container">

      <div class="admin-header">
        <h1>Add New Post</h1>
        <p>Create and publish a new Real Insight article.</p>
      </div>


      <form id="postForm">

        <!-- =====================================
             TITLE
        ====================================== -->

        <div class="form-group">

          <label for="title">
            Post Title
          </label>

          <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter post title"
            autocomplete="off"
            required
          >

        </div>


        <!-- =====================================
             SLUG
        ====================================== -->

        <div class="form-group">

          <label for="slug">
            URL Slug
          </label>

          <input
            type="text"
            id="slug"
            name="slug"
            readonly
          >

          <div class="slug-preview">
            /<span id="slugPreview">your-post-title</span>
          </div>

        </div>


        <!-- =====================================
             CATEGORY
        ====================================== -->

        <div class="form-group">

          <label for="category">
            Category
          </label>

          <input
            type="text"
            id="category"
            name="category"
            placeholder="e.g. Nigeria, Politics, Business"
            required
          >

        </div>


        <!-- =====================================
             READING TIME
        ====================================== -->

        <div class="form-group">

          <label for="readingTime">
            Reading Time
          </label>

          <input
            type="text"
            id="readingTime"
            name="readingTime"
            placeholder="Leave blank to calculate automatically"
          >

        </div>


        <!-- =====================================
             EXCERPT
        ====================================== -->

        <div class="form-group">

          <label for="excerpt">
            Excerpt
          </label>

          <textarea
            id="excerpt"
            name="excerpt"
            rows="4"
            placeholder="Write a short description of the article"
            required
          ></textarea>

        </div>


        <!-- =====================================
             CONTENT EDITOR
        ====================================== -->

        <div class="form-group">

          <label for="contentEditor">
            Post Content
          </label>


          <div class="editor-wrapper">


            <!-- TOOLBAR -->

            <div
              class="editor-toolbar"
              role="toolbar"
              aria-label="Post formatting tools"
            >


              <!-- BLOCK FORMAT -->

              <select
                id="formatBlock"
                aria-label="Text format"
                title="Text format"
              >

                <option value="p">
                  Paragraph
                </option>

                <option value="h1">
                  Heading 1
                </option>

                <option value="h2">
                  Heading 2
                </option>

                <option value="h3">
                  Heading 3
                </option>

                <option value="h4">
                  Heading 4
                </option>

                <option value="h5">
                  Heading 5
                </option>

                <option value="h6">
                  Heading 6
                </option>

              </select>


              <span class="toolbar-separator"></span>


              <!-- TEXT FORMATTING -->

              <button
                type="button"
                data-command="bold"
                title="Bold"
                aria-label="Bold"
              >
                <strong>B</strong>
              </button>


              <button
                type="button"
                data-command="italic"
                title="Italic"
                aria-label="Italic"
              >
                <em>I</em>
              </button>


              <button
                type="button"
                data-command="underline"
                title="Underline"
                aria-label="Underline"
              >
                <u>U</u>
              </button>


              <button
                type="button"
                data-command="strikeThrough"
                title="Strikethrough"
                aria-label="Strikethrough"
              >
                <s>S</s>
              </button>


              <span class="toolbar-separator"></span>


              <!-- LISTS -->

              <button
                type="button"
                data-command="insertUnorderedList"
                title="Bulleted list"
                aria-label="Bulleted list"
              >
                ☷
              </button>


              <button
                type="button"
                data-command="insertOrderedList"
                title="Numbered list"
                aria-label="Numbered list"
              >
                ≡
              </button>


              <span class="toolbar-separator"></span>


              <!-- ALIGNMENT -->

              <button
                type="button"
                data-command="justifyLeft"
                title="Align left"
                aria-label="Align left"
              >
                ≡
              </button>


              <button
                type="button"
                data-command="justifyCenter"
                title="Align center"
                aria-label="Align center"
              >
                ≡
              </button>


              <button
                type="button"
                data-command="justifyRight"
                title="Align right"
                aria-label="Align right"
              >
                ≡
              </button>


              <span class="toolbar-separator"></span>


              <!-- BLOCKQUOTE -->

              <button
                type="button"
                id="blockquoteButton"
                title="Blockquote"
                aria-label="Blockquote"
              >
                “
              </button>


              <!-- LINK -->

              <button
                type="button"
                id="linkButton"
                title="Insert link"
                aria-label="Insert link"
              >
                🔗
              </button>


              <button
                type="button"
                data-command="unlink"
                title="Remove link"
                aria-label="Remove link"
              >
                🔗
              </button>


              <!-- IMAGE -->

              <button
                type="button"
                id="imageButton"
                title="Insert image"
                aria-label="Insert image"
              >
                🖼
              </button>


              <!-- HORIZONTAL RULE -->

              <button
                type="button"
                id="horizontalRuleButton"
                title="Horizontal rule"
                aria-label="Horizontal rule"
              >
                ―
              </button>


              <span class="toolbar-separator"></span>


              <!-- UNDO / REDO -->

              <button
                type="button"
                id="undoButton"
                title="Undo"
                aria-label="Undo"
              >
                ↶
              </button>


              <button
                type="button"
                id="redoButton"
                title="Redo"
                aria-label="Redo"
              >
                ↷
              </button>


              <!-- CLEAR FORMATTING -->

              <button
                type="button"
                data-command="removeFormat"
                title="Clear formatting"
                aria-label="Clear formatting"
              >
                Tx
              </button>

            </div>


            <!-- EDITABLE CONTENT -->

            <div
              id="contentEditor"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              spellcheck="true"
            ></div>


            <!-- HIDDEN CONTENT FIELD -->

            <textarea
              id="content"
              name="content"
              hidden
            ></textarea>

          </div>

        </div>


        <!-- =====================================
             TAGS
        ====================================== -->

        <div class="form-group">

          <label for="tags">
            Tags
          </label>

          <input
            type="text"
            id="tags"
            name="tags"
            placeholder="Separate tags with commas"
          >

        </div>


        <!-- =====================================
             ACCESS CODE
        ====================================== -->

        <div class="form-group">

          <label for="accessCode">
            Access Code
          </label>

          <input
            type="password"
            id="accessCode"
            name="accessCode"
            placeholder="Enter publishing access code"
            autocomplete="off"
            required
          >

        </div>


        <!-- =====================================
             MESSAGE
        ====================================== -->

        <div
          id="formMessage"
          class="form-message"
          aria-live="polite"
        ></div>


        <!-- =====================================
             PUBLISH BUTTON
        ====================================== -->

        <button
          type="submit"
          id="publishButton"
        >
          Publish Post
        </button>

      </form>

    </section>

  </main>


  <!-- =========================================
       IMAGE INSERT DIALOG
  ========================================== -->

  <dialog
    id="imageDialog"
    class="editor-dialog"
  >

    <form method="dialog">

      <h2>
        Insert Image
      </h2>


      <label for="imageUrl">
        Image URL
      </label>

      <input
        type="url"
        id="imageUrl"
        placeholder="https://example.com/image.jpg"
        autocomplete="off"
      >


      <label for="imageAlt">
        Alt Text
      </label>

      <input
        type="text"
        id="imageAlt"
        placeholder="Describe the image"
        autocomplete="off"
      >


      <div class="editor-dialog-actions">

        <button
          type="button"
          id="cancelImageButton"
        >
          Cancel
        </button>


        <button
          type="button"
          id="insertImageButton"
        >
          Insert Image
        </button>

      </div>

    </form>

  </dialog>


  <script src="/app.js"></script>
  <script src="/add-post.js"></script>

</body>
</html>
