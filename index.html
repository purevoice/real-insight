<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Real Insight</title>

  <meta
    name="description"
    content="Real Insight"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    /* =========================================
       CATEGORY SIDEBAR
       ========================================= */

    .category-sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }


    /*
     * Category rows
     */

    .category-sidebar-item {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      min-height: 48px;
      padding: 11px 12px 11px 17px;

      border-radius: 9px;

      background: #f5f5f4;
      color: #1c1917;

      text-decoration: none;

      font-size: 12px;
      font-weight: 500;

      overflow: hidden;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    /*
     * Colored accent
     */

    .category-sidebar-item::before {
      content: "";

      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background: #f59e0b;
    }

    .category-sidebar-item:nth-child(2)::before {
      background: #3b82f6;
    }

    .category-sidebar-item:nth-child(3)::before {
      background: #10b981;
    }

    .category-sidebar-item:nth-child(4)::before {
      background: #8b5cf6;
    }

    .category-sidebar-item:nth-child(5)::before {
      background: #ef4444;
    }

    .category-sidebar-item:nth-child(6)::before {
      background: #ec4899;
    }

    .category-sidebar-item:nth-child(7)::before {
      background: #14b8a6;
    }

    .category-sidebar-item:nth-child(8)::before {
      background: #f97316;
    }


    /*
     * Hover
     */

    .category-sidebar-item:hover {
      background: #fafaf9;

      transform: translateX(3px);

      box-shadow:
        0 4px 12px rgba(28, 25, 23, 0.08);
    }


    /*
     * Category name
     */

    .category-sidebar-item span:first-child {
      min-width: 0;
    }


    /*
     * Post count badge
     */

    .category-sidebar-item span:last-child {
      flex-shrink: 0;

      min-width: 28px;
      height: 24px;

      padding: 0 8px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background: #ffffff;
      color: #78716c;

      font-size: 12px;
      font-weight: 800;

      line-height: 1;
    }


    /*
     * Active category
     */

    .category-sidebar-item.active {
      background: #fef3c7;
      color: #92400e;

      box-shadow:
        0 3px 10px rgba(245, 158, 11, 0.12);
    }

    .category-sidebar-item.active span:last-child {
      background: #f59e0b;
      color: #1c1917;
    }


    /*
     * Categories widget
     */

    .sidebar .widget + .widget {
      margin-top: 28px;
    }

    .sidebar .widget:has(.category-sidebar-list) {
      padding: 22px;
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(28, 25, 23, 0.06);
    }

    .sidebar .widget:has(.category-sidebar-list) .widget-title {
      margin: 0 0 18px;
      padding-bottom: 14px;

      border-bottom: 1px solid #e7e5e4;

      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
      color: #1c1917;
    }


    /*
     * Mobile
     */

    @media (max-width: 800px) {

      .sidebar .widget + .widget {
        margin-top: 24px;
      }

    }
  </style>

</head>

<body>

<header>

  <div class="nav-container">

    <a
      href="/"
      class="logo"
    >
      Real Insight<span class="logo-dot"></span>
    </a>

    <nav
      class="nav-links"
      id="navLinks"
    >

      <a
        href="/"
        class="active"
      >
        Home
      </a>

      <a href="/categories">
        Categories
      </a>

      <a href="/add-post">
        Add New Post
      </a>

    </nav>

    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="Toggle navigation"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>

</header>


<main>

  <section class="home-container">

    <div class="page-intro">

      <h1>
        Real Insight
      </h1>

      <p>
        Ideas, information and perspectives that matter.
      </p>

    </div>


    <div class="content-layout">


      <section class="posts-section">

        <div class="section-heading">

          <h2>
            Latest Posts
          </h2>

        </div>


        <div
          class="post-list"
          id="postList"
        >

          <!-- POSTS_START -->
          <!-- POSTS_END -->

        </div>


        <div
          class="empty-state"
          id="emptyState"
          hidden
        >
          No posts have been published yet.
        </div>

      </section>



      <aside class="sidebar">


        <div class="widget">

          <h3 class="widget-title">
            Recent Posts
          </h3>


          <ul
            class="recent-list"
            id="recentPosts"
          >

            <!-- RECENT_POSTS_START -->
            <!-- RECENT_POSTS_END -->

          </ul>

        </div>



        <div class="widget">

          <h3 class="widget-title">
            Categories
          </h3>


          <div class="category-sidebar-list">

            {{CATEGORY_SIDEBAR}}

          </div>

        </div>


      </aside>


    </div>

  </section>

</main>


<footer>

  <p>

    &copy;

    <span id="currentYear"></span>

    <strong>
      Real Insight
    </strong>.

    All rights reserved.

  </p>

</footer>


<script src="/app.js"></script>

</body>

</html>
