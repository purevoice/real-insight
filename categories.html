<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="pageTitle">Category | Real Insight</title>

  <meta
    name="description"
    id="pageDescription"
    content="Browse Real Insight posts by category."
  >

  <link rel="stylesheet" href="/style.css">
  <style>
  /* =========================================
     CATEGORY PAGE
     ========================================= */

  .category-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 40px;
    align-items: start;
  }

  .category-posts {
    min-width: 0;
  }

  .category-sidebar {
    width: 100%;
  }

  .sidebar-section {
    border: 1px solid #e7e5e4;
    border-radius: 12px;
    padding: 20px;
    background: #ffffff;
  }

  .sidebar-section h2 {
    margin: 0 0 16px;
    font-size: 20px;
    line-height: 1.3;
  }

  .category-sidebar-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .category-sidebar-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 14px;
    border-radius: 8px;
    text-decoration: none;
    background: #f5f5f4;
    color: #1c1917;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .category-sidebar-item:hover {
    background: #e7e5e4;
    transform: translateY(-1px);
  }

  .category-sidebar-item span:last-child {
    font-size: 13px;
    font-weight: 700;
    color: #78716c;
  }

  .category-sidebar-item.active {
    background: #f59e0b;
    color: #1c1917;
  }

  .category-sidebar-item.active span:last-child {
    color: #1c1917;
  }

  @media (max-width: 800px) {

    .category-layout {
      grid-template-columns: 1fr;
      gap: 30px;
    }

    .category-sidebar {
      order: 2;
    }

  }
</style>
</head>

<body>

<header>
  <div class="nav-container">

    <a href="/" class="logo">
      Real Insight<span class="logo-dot"></span>
    </a>

    <nav class="nav-links" id="navLinks">

      <a href="/">
        Home
      </a>

      <a href="/categories">
        Categories
      </a>

      <a href="/add-post">
        Add New Post
      </a>

    </nav>

    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="Toggle navigation"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>


<main>

  <section class="home-container">

    <div class="page-intro">

      <p class="breadcrumb">
        <a href="/">Home</a>
        /
        <span>Category</span>
      </p>

      <h1 id="categoryTitle">
        Category
      </h1>

      <p id="categoryDescription">
        Browse the latest posts in this category.
      </p>

    </div>


    <div class="category-layout">

      <section class="category-posts">

        <div
  id="categoryPostList"
  class="post-list"
>
  <!-- CATEGORY_POSTS_START -->
  <!-- CATEGORY_POSTS_END -->
</div>

      </section>


      <aside class="category-sidebar">

        <div class="sidebar-section">

          <h2>
            Categories
          </h2>

          <div
  id="categorySidebar"
  class="category-sidebar-list"
>
  <!-- CATEGORY_SIDEBAR_START -->
  <!-- CATEGORY_SIDEBAR_END -->
</div>

        </div>

      </aside>

    </div>

  </section>

</main>


<footer>

  <p>
    &copy;
    <span id="currentYear"></span>
    <strong>Real Insight</strong>.
    All rights reserved.
  </p>

</footer>


<script src="/app.js"></script>

</body>
</html>
