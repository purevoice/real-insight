<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="pageTitle">Category | Real Insight</title>

  <meta
    name="description"
    id="pageDescription"
    content="Browse Real Insight posts by category."
  >

  <link rel="stylesheet" href="/style.css">
  <style>
  /* =========================================
     CATEGORY PAGE
     ========================================= */

  .category-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 44px;
    align-items: start;
  }

  .category-posts {
    min-width: 0;
  }

  .category-sidebar {
    width: 100%;
  }

  /*
   * White sidebar card
   */

  .sidebar-section {
    padding: 22px;
    background: #ffffff;
    border: 1px solid #e7e5e4;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(28, 25, 23, 0.06);
  }

  .sidebar-section h2 {
    margin: 0 0 18px;
    padding-bottom: 14px;

    border-bottom: 1px solid #e7e5e4;

    font-size: 14px;
    line-height: 1.3;
    font-weight: 700;
    color: #1c1917;
  }

  .category-sidebar-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  /*
   * Category rows
   */

  .category-sidebar-item {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;

    min-height: 48px;
    padding: 11px 12px 11px 17px;

    border-radius: 9px;

    background: #f5f5f4;
    color: #1c1917;

    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    overflow: hidden;

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }

  /*
   * Colored accent
   */

  .category-sidebar-item::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 4px;

    background: #f59e0b;
  }

  .category-sidebar-item:nth-child(2)::before {
    background: #3b82f6;
  }

  .category-sidebar-item:nth-child(3)::before {
    background: #10b981;
  }

  .category-sidebar-item:nth-child(4)::before {
    background: #8b5cf6;
  }

  .category-sidebar-item:nth-child(5)::before {
    background: #ef4444;
  }

  .category-sidebar-item:nth-child(6)::before {
    background: #ec4899;
  }

  .category-sidebar-item:nth-child(7)::before {
    background: #14b8a6;
  }

  .category-sidebar-item:nth-child(8)::before {
    background: #f97316;
  }

  /*
   * Hover
   */

  .category-sidebar-item:hover {
    background: #fafaf9;

    transform: translateX(3px);

    box-shadow:
      0 4px 12px rgba(28, 25, 23, 0.08);
  }

  /*
   * Category name
   */

  .category-sidebar-item span:first-child {
    min-width: 0;
  }

  /*
   * Post count badge
   */

  .category-sidebar-item span:last-child {
    flex-shrink: 0;

    min-width: 28px;
    height: 24px;

    padding: 0 8px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 999px;

    background: #ffffff;
    color: #78716c;

    font-size: 12px;
    font-weight: 800;

    line-height: 1;
  }

  /*
   * Active category
   */

  .category-sidebar-item.active {
    background: #fef3c7;
    color: #92400e;

    box-shadow:
      0 3px 10px rgba(245, 158, 11, 0.12);
  }

  .category-sidebar-item.active span:last-child {
    background: #f59e0b;
    color: #1c1917;
  }

  /*
   * Mobile
   */

  @media (max-width: 800px) {

    .category-layout {
      grid-template-columns: 1fr;
      gap: 32px;
    }

    .category-sidebar {
      order: 2;
    }

  }
</style>
</head>

<body>

<header>
  <div class="nav-container">

    <a href="/" class="logo">
      Real Insight<span class="logo-dot"></span>
    </a>

    <nav class="nav-links" id="navLinks">

      <a href="/">
        Home
      </a>

      <a href="/categories">
        Categories
      </a>

      <a href="/add-post">
        Add New Post
      </a>

    </nav>

    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="Toggle navigation"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>


<main>

  <section class="home-container">

    <div class="page-intro">

      <p class="breadcrumb">
        <a href="/">Home</a>
        /
        <span>Category</span>
      </p>

      <h1 id="categoryTitle">
        Category
      </h1>

      <p id="categoryDescription">
        Browse the latest posts in this category.
      </p>

    </div>


    <div class="category-layout">

      <section class="category-posts">

        <div
  id="categoryPostList"
  class="post-list"
>
  <!-- CATEGORY_POSTS_START -->
  <!-- CATEGORY_POSTS_END -->
</div>

      </section>


      <aside class="category-sidebar">

        <div class="sidebar-section">

          <h2>
            Categories
          </h2>

          <div
  id="categorySidebar"
  class="category-sidebar-list"
>
  <!-- CATEGORY_SIDEBAR_START -->
  <!-- CATEGORY_SIDEBAR_END -->
</div>

        </div>

      </aside>

    </div>

  </section>

</main>


<footer>

  <p>
    &copy;
    <span id="currentYear"></span>
    <strong>Real Insight</strong>.
    All rights reserved.
  </p>

</footer>


<script src="/app.js"></script>

</body>
</html>
